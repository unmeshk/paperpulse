{% extends "base.html" %}
{% block title %}Choose categories — PaperPulse{% endblock %}
{% block content %}
  <header class="post-header">
    <h1 class="post-title">Choose your categories</h1>
    <p class="site-description">Pick up to 5 arXiv categories for your daily feed.</p>
  </header>
  <form method="post" action="/onboarding">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    {% set picker_open = true %}
    {% include "category_picker.html" %}
    <button type="submit" data-save-categories>Save categories</button>
  </form>
{% endblock %}
